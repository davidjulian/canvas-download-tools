name: Test and prepare releases
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      draft_release:
        description: Prepare a draft prerelease after all checks pass
        type: boolean
        default: false
      tag:
        description: Draft prerelease tag
        type: string
        default: v0.2.1-rc1
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: bash -n Install.command && bash -n "Start App.command"
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CANVAS_RUN_BROWSER_TESTS: '1'
      CANVAS_TEST_BROWSER: ${{ startsWith(matrix.os, 'windows') && 'msedge' || 'chrome' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - if: runner.os == 'macOS'
        run: python -m playwright install chrome
      - run: python -m unittest discover -s tests -q
      - if: runner.os == 'macOS'
        run: test -x Install.command && test -x "Start App.command"
  package:
    needs: [unit, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: canvas-tools-source-packages
          path: dist/*
      - if: github.event_name == 'workflow_dispatch' && inputs.draft_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$ ]]; then exit 1; fi
          gh release create "$TAG" dist/* --draft --prerelease --title "Canvas Download Tools $TAG" --notes-file VALIDATION.md
    permissions:
      contents: write
